# Cloudflare Worker for AMP Linux VM
# 
# Setup:
#   1. wrangler login
#   2. wrangler kv:namespace create VM_CHUNKS
#   3. wrangler kv:namespace create VM_CHUNKS --preview
#   4. wrangler r2 bucket create amp-linux-vm-assets
#   5. Replace placeholder IDs below with actual IDs from steps 2-4
#   6. wrangler deploy
#
name = "amp-linux-vm"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Routes (update zone_name after wrangler login) ──────────────────
# routes = [
#   { pattern = "amp-linux-vm.*.workers.dev/*", zone_name = "your-zone" }
# ]

[env.production]
# Production: serve font-prepended chunks with long cache TTL
[vars]
FONT_HEADER_SIZE = "298"
CHUNK_SIZE_MB = "5"
CACHE_MAX_AGE = "2592000"  # 30 days

# ── KV Namespace (REQUIRED) — stores VM chunks ────────────────────
# Run: wrangler kv:namespace create VM_CHUNKS
# Copy the 'id' value below:
[[kv_namespaces]]
binding = "VM_CHUNKS"
id = "66b144f39a124b48a062907a93c02039"
preview_id = "66b144f39a124b48a062907a93c02039"

# ── R2 Bucket (OPTIONAL) — cheaper storage for large assets ──────
# Run: wrangler r2 bucket create amp-linux-vm-assets
# [[r2_buckets]]
# binding = "VM_ASSETS"
# bucket_name = "amp-linux-vm-assets"
# preview_bucket_name = "amp-linux-vm-assets-preview"

# ── Durable Objects (OPTIONAL) — persistent VM state ───────────
# [[durable_objects.bindings]]
# name = "VM_STATE"
# class_name = "VMState"

# [[migrations]]
# tag = "v1"
# new_classes = ["VMState"]
